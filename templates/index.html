<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reserva de Assentos - Campori 2026</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #1a1a2e; 
            color: white; 
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* CONTAINER FIXO (TUDO QUE FICA NO TOPO) */
        .header-fixo {
            position: sticky;
            top: 0;
            width: 100%;
            background: #1a1a2e;
            z-index: 1000;
            border-bottom: 2px solid #e94560;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            padding-bottom: 10px;
        }

        h1 { 
            margin: 15px 0 10px 0; 
            font-size: 20px; 
            color: #e94560; 
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .legend { 
            display: flex; 
            flex-direction: row; 
            justify-content: center;
            gap: 15px; 
        }

        .item { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: bold; }
        .dot { width: 14px; height: 14px; border-radius: 3px; }

        /* Cores da Legenda */
        .dot.livre { background: #0f3460; border: 1px solid #4ecca3; }
        .dot.reservado { background: #fca311; }
        .dot.pago { background: #e94560; }

        /* CONTEÚDO DO ÔNIBUS */
        .bus-wrapper {
            padding: 30px 10px;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .bus-container {
            background: #16213e;
            padding: 40px 20px 25px 20px;
            border-radius: 50px 50px 20px 20px;
            border-top: 10px solid #e94560;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            display: inline-block;
        }

        .bus-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 45px) 20px repeat(2, 45px); 
            gap: 12px; 
            justify-content: center;
        }

        .seat { 
            width: 45px; 
            height: 45px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 14px;
            font-weight: bold;
            transition: 0.3s;
            user-select: none;
        }

        .livre { background: #0f3460; border: 1px solid #4ecca3; color: #4ecca3; }
        .livre:hover { background: #4ecca3; color: #1a1a2e; transform: scale(1.1); }
        .reservado { background: #fca311; color: #14213d; }
        .pago { background: #e94560; color: white; cursor: not-allowed; opacity: 0.7; }

        .corredor { width: 20px; }

        @media (max-width: 480px) {
            .seat { width: 42px; height: 42px; }
            .bus-grid { grid-template-columns: repeat(2, 42px) 15px repeat(2, 42px); }
            h1 { font-size: 18px; }
        }
    </style>
</head>
<body>

    <div class="header-fixo">
        <h1>🚌 Campori 2026</h1>
        <div class="legend">
            <div class="item"><div class="dot livre"></div> Livre</div>
            <div class="item"><div class="dot reservado"></div> Reservado</div>
            <div class="item"><div class="dot pago"></div> Ocupado</div>
        </div>
    </div>

    <div class="bus-wrapper">
        <div class="bus-container">
            <div class="bus-grid">
                {% for a in assentos %}
    <div class="seat {{ a[1] }}" 
         onclick="if('{{ a[1] }}' === 'livre') { window.location.href='/reservar/{{ a[0] }}'; } else { alert('Ocupado!'); }">
        {{ a[0] }}
    </div>

    {% if loop.index % 2 == 0 and loop.index % 4 != 0 %}
        <div class="corredor"></div>
    {% endif %}
{% endfor %}
            </div>
        </div>
    </div>

</body>
</html>
