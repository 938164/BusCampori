<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reserva de Assentos - Campori 2026</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #1a1a2e; 
            color: white; 
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { margin: 20px 0; font-size: 22px; color: #e94560; text-align: center; }

        /* Container que coloca Legenda e Ônibus lado a lado */
        .layout-horizontal {
            display: flex;
            flex-direction: row; /* Força ficar um ao lado do outro */
            align-items: flex-start;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 600px;
        }

        /* LEGENDA NA LATERAL ESQUERDA */
        .legend { 
            display: flex; 
            flex-direction: column; /* Itens um abaixo do outro */
            gap: 15px; 
            background: rgba(22, 33, 62, 0.9);
            padding: 15px;
            border-radius: 12px;
            border-left: 4px solid #e94560;
            position: sticky; /* A legenda "segue" a tela ao rolar */
            top: 20px;
            min-width: 100px;
        }

        .item { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: bold; }
        .dot { width: 16px; height: 16px; border-radius: 4px; }

        /* Estilo dos Quadrinhos da Legenda */
        .dot.livre { background: #0f3460; border: 1px solid #4ecca3; }
        .dot.reservado { background: #fca311; }
        .dot.pago { background: #e94560; }

        /* ÔNIBUS */
        .bus-container {
            background: #16213e;
            padding: 30px 15px 15px 15px;
            border-radius: 40px 40px 15px 15px;
            border-top: 8px solid #e94560;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .bus-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 42px) 18px repeat(2, 42px); 
            gap: 8px; 
        }

        .seat { 
            width: 42px; 
            height: 42px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 13px;
            font-weight: bold;
            transition: 0.2s;
        }

        /* Cores dos Assentos */
        .livre { background: #0f3460; border: 1px solid #4ecca3; color: #4ecca3; }
        .reservado { background: #fca311; color: #14213d; }
        .pago { background: #e94560; color: white; cursor: not-allowed; opacity: 0.7; }

        .corredor { width: 18px; }

        /* RESPONSIVIDADE PARA CELULAR */
        @media (max-width: 480px) {
            .layout-horizontal {
                gap: 10px; /* Diminui espaço no celular */
            }
            .legend {
                padding: 10px;
                min-width: 80px;
            }
            .item { font-size: 11px; }
            .seat { width: 38px; height: 38px; font-size: 11px; }
            .bus-grid { grid-template-columns: repeat(2, 38px) 12px repeat(2, 38px); }
        }
    </style>
</head>
<body>

    <h1>🚌 Campori 2026</h1>

    <div class="layout-horizontal">
        <div class="legend">
            <div class="item"><div class="dot livre"></div> Livre</div>
            <div class="item"><div class="dot reservado"></div> Reservado</div>
            <div class="item"><div class="dot pago"></div> Ocupado</div>
        </div>

        <div class="bus-container">
            <div class="bus-grid">
                {% for a in assentos %}
                    <div class="seat {{a[1]}}" 
                         onclick="if('{{a[1]}}' == 'livre') { window.location.href='/reservar/{{a[0]}}'; } else { alert('Ocupado!'); }">
                        {{a[0]}}
                    </div>

                    {% if loop.index % 2 == 0 and loop.index % 4 != 0 %}
                        <div class="corredor"></div>
                    {% endif %}
                {% endfor %}
            </div>
        </div>
    </div>

</body>
</html>
