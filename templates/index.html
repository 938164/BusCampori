<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reserva de Assentos - Campori 2026</title>
    <style>
        /* Estilos Gerais */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #1a1a2e; 
            color: white; 
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 { 
            margin: 20px 0; 
            font-size: 22px; 
            color: #e94560; 
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Container Principal Responsivo */
        .main-content {
            display: flex;
            flex-direction: row; /* Lado a lado no PC */
            align-items: flex-start;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }

        /* LEGENDA LATERAL */
        .legend { 
            display: flex; 
            flex-direction: column;
            gap: 15px; 
            background: #16213e;
            padding: 20px;
            border-radius: 15px;
            border-left: 4px solid #e94560;
            min-width: 120px;
            position: sticky;
            top: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .item { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            font-size: 14px;
            font-weight: 500;
        }

        .dot { 
            width: 18px; 
            height: 18px; 
            border-radius: 4px; 
        }

        /* CONTAINER DO ÔNIBUS */
        .bus-container {
            background: #16213e;
            padding: 30px 15px 15px 15px;
            border-radius: 40px 40px 15px 15px;
            border-top: 8px solid #e94560;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        /* Grade de Assentos */
        .bus-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 42px) 20px repeat(2, 42px); 
            gap: 8px; 
            justify-content: center; 
        }

        .seat { 
            width: 42px; 
            height: 42px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 13px;
            font-weight: bold;
            transition: all 0.2s;
            user-select: none;
        }

        /* Cores de Status */
        .livre { background: #0f3460; border: 1px solid #4ecca3; color: #4ecca3; }
        .livre:hover { background: #4ecca3; color: #1a1a2e; transform: scale(1.1); }
        .reservado { background: #fca311; color: #14213d; }
        .pago { background: #e94560; color: white; cursor: not-allowed; opacity: 0.7; }

        .corredor { width: 20px; }

        /* RESPONSIVIDADE PARA CELULAR */
        @media (max-width: 600px) {
            .main-content {
                flex-direction: column; /* Legenda vai para cima do ônibus */
                align-items: center;
                gap: 15px;
            }

            .legend {
                flex-direction: row; /* Legenda deitada no celular */
                width: 90%;
                justify-content: space-around;
                position: static;
                padding: 12px;
                border-left: none;
                border-bottom: 3px solid #e94560;
            }

            h1 { font-size: 20px; }

            .seat {
                width: 45px; /* Um pouco maior no celular para o dedo acertar */
                height: 45px;
            }
            
            .bus-grid {
                grid-template-columns: repeat(2, 45px) 15px repeat(2, 45px);
            }
        }
    </style>
</head>
<body>

    <h1>🚌 Campori 2026</h1>

    <div class="main-content">
        <div class="legend">
            <div class="item">
                <div class="dot livre"></div> Livre
            </div>
            <div class="item">
                <div class="dot reservado"></div> Reservado
            </div>
            <div class="item">
                <div class="dot pago"></div> Ocupado
            </div>
        </div>

        <div class="bus-container">
            <div class="bus-grid">
                {% for a in assentos %}
                    <div class="seat {{a[1]}}" 
                         onclick="if('{{a[1]}}' == 'livre') { window.location.href='/reservar/{{a[0]}}'; } else { alert('Este assento já está ocupado!'); }">
                        {{a[0]}}
                    </div>

                    {# Adiciona o corredor central após o segundo assento de cada linha #}
                    {% if loop.index % 2 == 0 and loop.index % 4 != 0 %}
                        <div class="corredor"></div>
                    {% endif %}
                {% endfor %}
            </div>
        </div>
    </div>

</body>
</html>
